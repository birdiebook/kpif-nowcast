# Shadow forecasts, days 1-4 of each month (before SCB's flash estimate).
# Writes forecasts/shadow/<model>/<month>.json and the champion/challenger table in
# forecasts/SCORECARD.md, and commits them back. The live forecasts/<month>.json is not touched.
# A FINAL shadow file is never overwritten, so the later daily runs leave it as it is.
# Runs only on schedule or by hand; scheduled runs only happen on the default branch (after merge).
#
# Permission: contents: write lets the job's own GITHUB_TOKEN push this commit to this repository
# only. No other scopes, no secrets, no new account.
name: Monthly shadow forecasts

on:
  schedule:
    - cron: "23 5 1-4 * *"  # 05:23 UTC on days 1-4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpif-data
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      TZ: Europe/Stockholm  # FINAL/PRELIMINARY/LATE is decided on the Swedish date
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kpif-data-${{ github.run_id }}
          restore-keys: kpif-data-
      - name: Fetch forecast inputs, write shadow forecasts and scorecard
        run: python -m kpif_nowcast.pipeline monthly
      - name: Upload explanations (K3, outputs/explain, not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explain-${{ github.run_id }}
          path: outputs/explain
          if-no-files-found: ignore
          retention-days: 90
      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: kpif-data-${{ github.run_id }}
      - name: Commit shadow forecasts (CI only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/shadow forecasts/SCORECARD.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Shadow forecasts $(date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
