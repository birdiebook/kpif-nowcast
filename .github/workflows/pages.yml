# K10: publish "Sverigeläget" to GitHub Pages after every weekly data fetch and every monthly shadow run.
# Builds site/ with `python -m kpif_nowcast.pipeline site --offline` from the data in the Actions cache that
# weekly-fetch saves (restore only, nothing is fetched or saved here) plus the committed forecasts.
# Publishes only the aggregated open datasets the dashboard already shows. Needs no secret.
#
# One-time setup (cannot be done from code): Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# Permissions: pages: write + id-token: write are what actions/deploy-pages needs to publish this repo's Pages
# site (OIDC token for the Pages service); contents: read for checkout. No push to the repository.
name: Pages (Sverigeläget)

on:
  workflow_run:
    workflows: ["Weekly data fetch", "Monthly shadow forecasts"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # after a fetch/shadow run only when it succeeded (a failed run saved no new cache)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      TZ: Europe/Stockholm
    steps:
      - uses: actions/checkout@v4  # default branch head, incl. the shadow forecasts the monthly run committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r ci/requirements.txt
      - name: Restore data cache (saved by weekly-fetch / monthly-shadow)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kpif-data-${{ github.run_id }}
          restore-keys: kpif-data-
      - name: Check that the cache had data
        run: |
          test -f data/observations.parquet || { echo "no data in cache: run 'Weekly data fetch' first"; exit 1; }
      - name: Build site/
        run: python -m kpif_nowcast.pipeline site --offline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
