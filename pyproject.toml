[project]
name = "kpif-nowcast"
version = "0.1.0"
description = "Nowcasting Swedish CPIF inflation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
